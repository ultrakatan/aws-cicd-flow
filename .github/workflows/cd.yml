name: CD - Production Deploy

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  cd-deploy-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Connect AWS with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::211813536585:role/github-actions-real-flow-role
          aws-region: ap-northeast-1

      # ★ここからが、今回の実験用コマンドです！
      - name: Inspect Temporary Credentials (Security Test)
        run: |
          echo "=== 1. 普通に画面に表示してみる（自動黒塗りの検証） ==="
          echo "Access Key ID: $AWS_ACCESS_KEY_ID"
          echo "Secret Key   : $AWS_SECRET_ACCESS_KEY"
          echo "Session Token: $AWS_SESSION_TOKEN"
          
          echo "=== 2. 頭文字だけを切り取って、ASIAキーであることを証明する ==="
          echo "Access Key ID : $(echo $AWS_ACCESS_KEY_ID | cut -c 1-10)"
          echo "Secret Key    : $(echo $AWS_SECRET_ACCESS_KEY | cut -c 1-10)"
          echo "Session Token : $(echo $AWS_SESSION_TOKEN | cut -c 1-50)"
          
          echo "=== 3. トークンの『文字数』を数えて、長い文字列が存在することを確認する ==="
          echo "Session Token Length: ${#AWS_SESSION_TOKEN} characters"